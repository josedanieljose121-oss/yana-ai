<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100b20"><title>YANA AI</title>
<style>
:root{color-scheme:dark;--bg:#0d0918;--purple:#9b6cff;--muted:#a99bbd;--text:#f8f4ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#39205d,#130d22 48%,#0b0812);color:var(--text);font:15px/1.5 system-ui,Arial;min-height:100vh;display:flex;justify-content:center}.app{width:100%;max-width:900px;min-height:100vh;display:flex;flex-direction:column;padding:0 16px}header{height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff13}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#a879ff,#6837c9);display:grid;place-items:center;font-size:21px}.gradient{background:linear-gradient(90deg,#d4b5ff,#a879ff,#f0b5ff);-webkit-background-clip:text;background-clip:text;color:transparent}.status{font-size:11px;color:#cbb8e9;background:#ffffff0c;padding:7px 10px;border-radius:30px}main{flex:1;display:flex;flex-direction:column;width:100%;max-width:740px;margin:auto}.welcome{text-align:center;padding:65px 12px 20px}.orb{width:70px;height:70px;margin:0 auto 18px;border-radius:24px;background:linear-gradient(145deg,#b68aff,#6536bd);display:grid;place-items:center;font-size:34px}h1{font-size:clamp(29px,6vw,42px);line-height:1.1;margin:0 0 12px}.sub{color:var(--muted);max-width:470px;margin:auto}.suggestions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:23px 0}.suggestion{border:1px solid #ffffff18;background:#ffffff08;color:#e9defb;text-align:left;padding:13px;border-radius:15px;font:inherit;cursor:pointer}.suggestion b{display:block;font-size:13px}.suggestion span{font-size:12px;color:var(--muted)}#messages{display:none;flex:1;padding:24px 0;gap:16px;flex-direction:column}.msg{display:flex;gap:10px;max-width:94%;align-items:flex-start}.msg.user{align-self:flex-end;flex-direction:row-reverse}.avatar{width:31px;height:31px;flex:0 0 31px;border-radius:11px;background:#34234e;display:grid;place-items:center}.user .avatar{background:#7950c5}.bubble{padding:12px 15px;border:1px solid #ffffff13;background:#1b142a;border-radius:5px 17px 17px 17px;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:linear-gradient(135deg,#7146b8,#583494);border:0;border-radius:17px 5px 17px 17px}.composer-wrap{position:sticky;bottom:0;padding:14px 0 18px;background:linear-gradient(transparent,#0d0918 22%)}.composer{display:flex;gap:9px;align-items:flex-end;padding:9px;background:#1b142a;border:1px solid #ffffff20;border-radius:19px}.composer textarea{resize:none;max-height:130px;min-height:43px;flex:1;background:transparent;border:0;outline:0;color:var(--text);font:inherit;padding:10px 8px}.composer textarea::placeholder{color:#8f819f}.send{width:43px;height:43px;border:0;border-radius:13px;background:linear-gradient(135deg,#ad80ff,#7442ca);color:white;font-size:19px;cursor:pointer}.send:disabled{opacity:.5}.foot{text-align:center;color:#83758f;font-size:11px;padding-bottom:12px}@media(max-width:520px){.welcome{padding-top:45px}.suggestions{grid-template-columns:1fr}.status{font-size:10px}}
</style></head><body><div class="app"><header><div class="brand"><div class="logo">✦</div>YANA <span class="gradient">AI</span></div><div class="status">● IA conectada</div></header><main><section class="welcome" id="welcome"><div class="orb">✧</div><h1>Hola, soy <span class="gradient">YANA AI</span></h1><p class="sub">Tu asistente inteligente para preguntar, aprender, crear y resolver dudas.</p><div class="suggestions"><button class="suggestion" data-q="Explícame algo difícil de forma sencilla."><b>🧠 Aprende algo</b><span>Explicaciones claras</span></button><button class="suggestion" data-q="Ayúdame a crear una idea de proyecto."><b>💡 Crea una idea</b><span>De la idea al proyecto</span></button><button class="suggestion" data-q="Ayúdame a organizar mi semana."><b>📅 Organiza mi día</b><span>Planes y productividad</span></button><button class="suggestion" data-q="Cuéntame un dato curioso."><b>🌌 Sorpréndeme</b><span>Descubre algo nuevo</span></button></div></section><div id="messages" aria-live="polite"></div><div class="composer-wrap"><div class="composer"><textarea id="prompt" rows="1" placeholder="Escribe tu pregunta..." aria-label="Tu mensaje"></textarea><button class="send" id="send" aria-label="Enviar">➤</button></div></div><div class="foot">La IA puede equivocarse. Comprueba la información importante.</div></main></div>
<script>
const welcome=document.getElementById('welcome'),messages=document.getElementById('messages'),input=document.getElementById('prompt'),send=document.getElementById('send');
const history=[];
function add(text,who){const row=document.createElement('div');row.className='msg '+who;const av=document.createElement('div');av.className='avatar';av.textContent=who==='user'?'🙂':'✦';const b=document.createElement('div');b.className='bubble';b.textContent=text;row.append(av,b);messages.append(row);row.scrollIntoView({behavior:'smooth',block:'end'});return b}
async function ask(text){text=text.trim();if(!text||send.disabled)return;welcome.style.display='none';messages.style.display='flex';history.push({role:'user',content:text});add(text,'user');input.value='';input.style.height='auto';send.disabled=true;const reply=add('Pensando...','ai');
try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Error al conectar con la IA');reply.textContent=data.reply;history.push({role:'assistant',content:data.reply})}catch(e){reply.textContent='No pude conectar con el modelo: '+e.message+'. Revisa que el servidor esté iniciado y que la clave API esté configurada.'}finally{send.disabled=false;input.focus()}}
send.onclick=()=>ask(input.value);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(input.value)}});input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,130)+'px'});document.querySelectorAll('.suggestion').forEach(b=>b.onclick=()=>ask(b.dataset.q));
</script></body></html>
